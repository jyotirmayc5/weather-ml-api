[project]
name = "weather-ml-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy==2.0.52",
    "tenacity>=9.1.4",
    "tzdata>=2026.4 ; sys_platform == 'win32'",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
