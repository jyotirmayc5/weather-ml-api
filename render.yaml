# Deliberately does NOT include the existing `weather-ml-api` web service --
# that was created manually in the Render dashboard, not via Blueprint, and
# including it here risks Render's Blueprint sync altering its existing
# config on connect. Only the new shadow-mode cron jobs are defined below.
#
# DST fix: Render Cron Jobs schedules run in UTC with no IANA-timezone option
# (unlike n8n, whose workflow-level timezone setting made "0 45 9 * * *"
# genuinely mean 9:45am America/New_York year-round). The 3 ET-clock-time jobs
# below (daily-high-forecast, corrected-high-update, actual-high-update) are
# scheduled at BOTH possible UTC times for their target ET time (comma-
# separated hours, e.g. "45 13,14 * * *" for 9:45am ET), and each job checks
# the real NY-local time itself (src/scheduling.py's in_ny_time_window) and
# no-ops on whichever of the two daily ticks doesn't actually correspond to
# the intended moment. No twice-yearly manual schedule updates needed. The
# other two jobs (latest-observations, hourly-forecast) don't need this --
# "every 15 min" / "every hour at :02" are inherently DST-agnostic cadences,
# not tied to a specific ET clock time.
#
# Cutover status (WEATHER_KALSHI_TECHNICAL_PLAN.md Sec 4 Step 5): jobs move
# from their shadow_* variant (writing to _v2 staging tables) to the real
# variant (writing to production tables) one at a time, in the plan's stated
# order: latest-observations, daily-high-forecast, actual-high-update,
# hourly-forecast, corrected-high-update. A shadow_* entry and its real
# counterpart run in parallel only during that job's own cutover window --
# once n8n's matching trigger is confirmed disabled and the real job
# confirmed healthy, remove the shadow_* entry and its _v2 table. Don't leave
# both running indefinitely once a job has cut over.

services:
  # REAL cutover has started (WEATHER_KALSHI_TECHNICAL_PLAN.md Sec 4 Step 5):
  # this writes to the real weather_observations table, not the _v2 staging
  # one. Runs alongside shadow-latest-observations (below) until n8n's
  # "Schedule actuals latest" trigger is confirmed disabled and this is
  # confirmed as the sole healthy writer -- then remove the shadow entry.
  # Remember: this is a NEW service via Auto Sync, so DATABASE_URL needs to
  # be added manually on its Environment tab after it's created (Auto Sync
  # has no interactive secret-entry step -- this exact gap caused the
  # kalshi-settlement-pull outage earlier in this project).
  - type: cron
    name: latest-observations
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.latest_observations_job
    schedule: "*/15 * * * *"
    envVars:
      - key: DATABASE_URL
        sync: false

  # REAL cutover, job #2 (WEATHER_KALSHI_TECHNICAL_PLAN.md Sec 4 Step 5): writes
  # to the real weather_daily_high_predictions table for all 4 stations, fixing
  # the confirmed Sec 0b bug (n8n's 3 non-KNYC insert nodes have no real
  # ON CONFLICT on (target_date, station)). Runs alongside
  # shadow-daily-high-forecast until n8n's 4 daily-high trigger nodes (all
  # firing at 9:45am ET) are confirmed disabled and this is confirmed as the
  # sole healthy writer -- then remove the shadow entry below. Remember:
  # new service via Auto Sync, so DATABASE_URL needs to be added manually on
  # its Environment tab after it's created.
  - type: cron
    name: daily-high-forecast
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.daily_high_forecast_job
    schedule: "45 13,14 * * *" # fires at both possible UTC times for 9:45am ET -- see DST note above
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: shadow-hourly-forecast
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.shadow_hourly_forecast_job
    schedule: "2 * * * *"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PREDICT_API_URL
        value: https://weather-ml-api-uv0s.onrender.com

  - type: cron
    name: shadow-daily-high-forecast
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.shadow_daily_high_forecast_job
    schedule: "45 13,14 * * *" # fires at both possible UTC times for 9:45am ET -- see DST note above
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: shadow-corrected-high-update
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.shadow_corrected_high_update_job
    schedule: "50 13,14 * * *" # ~5 min after daily-high, both possible UTC times for 9:50am ET
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: shadow-actual-high-update
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.shadow_actual_high_update_job
    schedule: "55 3,4 * * *" # fires at both possible UTC times for 11:55pm ET -- see DST note above
    envVars:
      - key: DATABASE_URL
        sync: false

  # Not shadow-mode -- writes to the real kalshi_settlements table directly
  # (nothing in n8n conflicts with this, it's new functionality, not a
  # migrated flow). No DST guard needed either: this isn't tied to a specific
  # NY clock moment, just "check periodically for newly-settled markets."
  - type: cron
    name: kalshi-settlement-pull
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.kalshi_settlement_job
    schedule: "0 15 * * *"
    envVars:
      - key: DATABASE_URL
        sync: false
