# Deliberately does NOT include the existing `weather-ml-api` web service --
# that was created manually in the Render dashboard, not via Blueprint, and
# including it here risks Render's Blueprint sync altering its existing
# config on connect. Only the new shadow-mode cron jobs are defined below.
#
# DST fix: Render Cron Jobs schedules run in UTC with no IANA-timezone option
# (unlike n8n, whose workflow-level timezone setting made "0 45 9 * * *"
# genuinely mean 9:45am America/New_York year-round). The 3 ET-clock-time jobs
# below (daily-high-forecast, corrected-high-update, actual-high-update) are
# scheduled at BOTH possible UTC times for their target ET time (comma-
# separated hours, e.g. "45 13,14 * * *" for 9:45am ET), and each job checks
# the real NY-local time itself (src/scheduling.py's in_ny_time_window) and
# no-ops on whichever of the two daily ticks doesn't actually correspond to
# the intended moment. No twice-yearly manual schedule updates needed. The
# other two jobs (latest-observations, hourly-forecast) don't need this --
# "every 15 min" / "every hour at :02" are inherently DST-agnostic cadences,
# not tied to a specific ET clock time.
#
# These are shadow-mode only: they write to the _v2 staging tables, not
# production. Once WEATHER_KALSHI_TECHNICAL_PLAN.md's shadow-mode validation
# passes, swap startCommand to the real (non-shadow) job module and delete
# the shadow_*.py files + _v2 tables -- don't leave both running forever.

services:
  - type: cron
    name: shadow-latest-observations
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.shadow_latest_observations_job
    schedule: "*/15 * * * *"
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: shadow-hourly-forecast
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.shadow_hourly_forecast_job
    schedule: "2 * * * *"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PREDICT_API_URL
        value: https://weather-ml-api-uv0s.onrender.com

  - type: cron
    name: shadow-daily-high-forecast
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.shadow_daily_high_forecast_job
    schedule: "45 13,14 * * *" # fires at both possible UTC times for 9:45am ET -- see DST note above
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: shadow-corrected-high-update
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.shadow_corrected_high_update_job
    schedule: "50 13,14 * * *" # ~5 min after daily-high, both possible UTC times for 9:50am ET
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: shadow-actual-high-update
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.shadow_actual_high_update_job
    schedule: "55 3,4 * * *" # fires at both possible UTC times for 11:55pm ET -- see DST note above
    envVars:
      - key: DATABASE_URL
        sync: false

  # Not shadow-mode -- writes to the real kalshi_settlements table directly
  # (nothing in n8n conflicts with this, it's new functionality, not a
  # migrated flow). No DST guard needed either: this isn't tied to a specific
  # NY clock moment, just "check periodically for newly-settled markets."
  - type: cron
    name: kalshi-settlement-pull
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.kalshi_settlement_job
    schedule: "0 15 * * *"
    envVars:
      - key: DATABASE_URL
        sync: false
